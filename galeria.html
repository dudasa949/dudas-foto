    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" type="image/x-icon" href="https://res.cloudinary.com/n5bkfxuh/image/upload/v1792336551/favicon.ico">

<body class="bg-darkbg text-gray-100 antialiased selection:bg-accent selection:text-white">

    <header class="fixed top-0 inset-x-0 z-50 bg-black/30 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center" aria-label="AD Visuals – főoldal">
                <img src="https://res.cloudinary.com/n5bkfxuh/image/upload/v1792321768/logo.png" alt="AD Visuals" class="h-11 w-auto">

            <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="index.html" class="nav-link text-gray-300 hover:text-accent transition">Főoldal</a>

                <a href="kapcsolat.html" class="bg-accent hover:bg-accenthover text-white px-6 py-2.5 rounded-full font-semibold transition shadow-lg shadow-accent/25">Kapcsolat</a>
            </nav>
            <button id="mobile-menu-btn" class="md:hidden text-gray-300 hover:text-white text-2xl focus:outline-none" aria-label="Menü">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <div id="mobile-nav" class="hidden md:hidden bg-black/60 backdrop-blur-xl border-t border-white/10 px-6 py-4 space-y-3">
            <a href="index.html" class="block text-gray-200 hover:text-accent font-medium py-2">Főoldal</a>

            <a href="kapcsolat.html" class="block bg-accent text-white text-center py-2.5 rounded-xl font-semibold mt-2">Kapcsolat</a>

    <main class="pt-32 pb-24 max-w-7xl mx-auto px-6">
        <div class="max-w-2xl">
            <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight">Galéria</h1>
            <p class="mt-4 text-lg text-gray-300 font-light">Képek azokról rallyversenyekről, amelyeken ott voltam.</p>
        </div>

        <div class="mt-10 flex flex-wrap items-center justify-between gap-4">
            <div id="album-chips" class="flex flex-wrap gap-2"></div>
            <div id="orient-chips" class="flex gap-2"></div>
        </div>
        <p id="gallery-count" class="mt-5 text-sm text-gray-400"></p>
        <div id="gallery" class="mt-8 space-y-16" aria-live="polite"></div>
    </main>

    <footer class="border-t border-white/10 text-sm text-gray-400">
        <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-4">

                <img src="https://res.cloudinary.com/n5bkfxuh/image/upload/v1792321768/logo.png" alt="AD Visuals" class="h-7 w-auto">

            </div>
            <nav class="flex items-center gap-6">
                <a href="gyik.html" class="hover:text-accent transition">GYIK</a>
                <a href="#" class="protected-email hover:text-accent transition"></a>
                <a href="https://instagram.com/adudas.949" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="hover:text-accent transition"><i class="fa-brands fa-instagram text-lg"></i></a>
            </nav>
        </div>
    </footer>

    <!-- Nagyított nézet -->
    <div id="lb" class="fixed inset-0 z-[100] hidden bg-black/95" role="dialog" aria-modal="true" aria-label="Képnézegető">
        <button id="lb-close" aria-label="Bezárás" class="absolute top-4 right-4 z-10 w-11 h-11 rounded-full bg-white/10 hover:bg-accent transition"><i class="fa-solid fa-xmark"></i></button>
        <button id="lb-prev" aria-label="Előző kép" class="absolute left-3 top-1/2 -translate-y-1/2 z-10 w-11 h-11 rounded-full bg-white/10 hover:bg-accent transition"><i class="fa-solid fa-chevron-left"></i></button>
        <button id="lb-next" aria-label="Következő kép" class="absolute right-3 top-1/2 -translate-y-1/2 z-10 w-11 h-11 rounded-full bg-white/10 hover:bg-accent transition"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="h-full flex flex-col items-center justify-center px-4 sm:px-20 py-16">
            <img id="lb-img" alt="" class="max-h-[76vh] max-w-full object-contain rounded-lg transition-opacity duration-300">
            <div class="mt-5 w-full max-w-3xl flex items-center justify-between gap-4">
                <div>
                    <p id="lb-title" class="font-semibold text-white"></p>
                    <p id="lb-meta" class="text-sm text-gray-400"></p>
